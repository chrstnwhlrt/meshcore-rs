[package]
name = "meshcore"
version = "0.10.7"
edition = "2024"
# The newest versions of aes (0.9.4) and, with the ble feature, uuid (1.29.3)
# need Rust 1.89. With edition 2024 Cargo resolves dependencies against this
# value, so it has to be at least what the newest dependency versions require.
rust-version = "1.89"
authors = ["Christian Wohlert <christian667@gmail.com>"]
description = "A Rust client library for MeshCore companion radios (serial, TCP and BLE)"
license = "MIT"
repository = "https://github.com/chrstnwhlrt/meshcore-rs"
keywords = ["meshcore", "mesh", "lora", "serial", "ble"]
categories = ["network-programming", "embedded", "asynchronous"]

[dependencies]
# Async runtime: tasks, channels, timers, async I/O and TCP
tokio = { version = "1.54.1", features = ["rt", "sync", "time", "io-util", "net"] }
# Serial port
tokio-serial = "5.5.0"
# Logging facade (target "meshcore"); the application picks the logger
log = "0.4.35"
# Channel keys, flood scope keys, packet and message hashes
sha2 = "0.11.1"
# Matching group packets in the RX log to their channel
hmac = "0.13.0"
# Decrypting group packets in the RX log
aes = "0.9.4"

# Serialize impls with meshcore_py's payload layout (feature "serde")
serde = { version = "1.0.229", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
# BLE through BlueZ (feature "ble")
bluer = { version = "0.17.4", features = ["bluetoothd"], optional = true }
# Reading the notification and event streams bluer hands out (feature "ble")
futures-util = { version = "0.3.34", default-features = false, optional = true }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "signal", "test-util"] }
serde_json = "1.0.154"

[features]
default = []
# BLE companions over the Nordic UART service, through BlueZ (Linux only;
# without effect elsewhere). Needs libdbus.
ble = ["dep:bluer", "dep:futures-util"]
# serde::Serialize for events and data types, field names as in meshcore_py
serde = ["dep:serde"]

[package.metadata.docs.rs]
all-features = true

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Allow certain patterns that are acceptable for this library
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# Allow patterns needed for protocol handling
cast_possible_truncation = "allow"
